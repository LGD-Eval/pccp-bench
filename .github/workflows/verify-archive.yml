name: verify-archive

# 目的：让"外人可复跑"这件事不停在 README 的一句话里。
# 每次改动、每周一次，GitHub 自己的机器从 Zenodo 下载归档、校验 sha256、复算 Merkle 根、
# 跑参考适配器，任何一项不符就红。绿了就是把"可复跑"钉在别人的基础设施上。
#
# 2026-11-26 改动：Zenodo 单点故障加固。
#   实测 zenodo.org/records/24551199 曾整体返回 503（API 与文件同一时刻 503），
#   这不是数据缺陷，但会让本工作流红。现在：Zenodo 为主（重试+退避），
#   Zenodo 不可达时退到仓库内 mirror/（字节相同、sha256 钉死），并在日志与
#   job summary 里明确写 SOURCE=mirror —— 退路是"验字节与分数"，不是"证明 Zenodo 在线"。

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"   # 每周一 03:23 UTC
  workflow_dispatch:

env:
  ZENODO_URL: "https://zenodo.org/records/24551199/files/pccp-bench_zenodo_v0.1.3.zip"
  MIRROR_PATH: "mirror/pccp-bench_zenodo_v0.1.3.zip"
  EXPECT_SHA: "5151fe7ffa48be46ad55201bf334b536320535805363fa81c3f93a809d942b83"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: kappa selftest (four-class)
        run: python annotation/kappa.py --selftest
      - name: Download archive (Zenodo primary, in-repo mirror fallback)
        run: |
          set -u
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "--- Zenodo attempt $i ---"
            if curl -fLS --connect-timeout 20 --max-time 240 --retry 3 --retry-delay 10 --retry-all-errors \
                 -o p.zip "$ZENODO_URL"; then
              ok=1; break
            fi
            rc=$?
            echo "attempt $i failed rc=$rc; backing off $((i*15))s"
            sleep $((i*15))
          done
          if [ "$ok" = "1" ]; then
            echo "SOURCE=zenodo" >> "$GITHUB_ENV"
            echo "**SOURCE=zenodo** — archive fetched live from Zenodo." >> "$GITHUB_STEP_SUMMARY"
            got=$(sha256sum p.zip | cut -d' ' -f1)
            if [ "$got" != "$EXPECT_SHA" ]; then
              echo "::error title=Zenodo bytes drifted::sha256 $got != expected $EXPECT_SHA"
              exit 1
            fi
            mirror=$(sha256sum "$MIRROR_PATH" | cut -d' ' -f1)
            if [ "$mirror" != "$EXPECT_SHA" ]; then
              echo "::error title=Mirror diverged::in-repo mirror $mirror != expected $EXPECT_SHA"
              exit 1
            fi
            echo "Zenodo bytes == in-repo mirror == $EXPECT_SHA"
          else
            echo "SOURCE=mirror" >> "$GITHUB_ENV"
            echo "::warning title=Zenodo unavailable after 6 attempts::Fell back to in-repo byte-identical mirror (sha256 pinned). Bytes and scores are still verified; Zenodo availability is NOT verified by this run."
            echo "**SOURCE=mirror** — Zenodo was unavailable; verified against in-repo mirror (sha256 pinned). Zenodo availability not proven by this run." >> "$GITHUB_STEP_SUMMARY"
            cp "$MIRROR_PATH" p.zip
          fi

      - name: Check archive sha256
        run: |
          echo "$EXPECT_SHA  p.zip" | sha256sum -c -

      - name: Unpack
        run: |
          mkdir -p work && cd work && unzip -q ../p.zip
          find . -maxdepth 2 -type d | head -20

      - name: Verify MANIFEST byte-for-byte and recompute Merkle root
        run: |
          python - <<'PY'
          import json, hashlib, sys, pathlib, os
          base = pathlib.Path("work")
          # 找到含 MANIFEST.json 的目录（归档内可能有一层前缀）
          man = next(base.rglob("MANIFEST.json"), None)
          assert man, "MANIFEST.json not found in archive"
          root_txt = man.parent / "ROOT.txt"
          m = json.loads(man.read_text(encoding="utf-8"))

          bad = []
          leaves = []
          for f in m["files"]:
              p = man.parent / f.get("archive_path", f["path"])
              if not p.exists():
                  bad.append(("missing", str(p)))
                  continue
              d = hashlib.sha256(p.read_bytes()).hexdigest()
              if d != f["sha256"]:
                  bad.append(("sha mismatch", f["path"], d))
              leaves.append((f["path"], d))
          assert not bad, f"MANIFEST mismatch: {bad[:5]}"

          def merkle(items):
              items = sorted(items, key=lambda t: t[0])
              cur = [(t[0], bytes.fromhex(t[1])) for t in items]
              while len(cur) > 1:
                  nxt = []
                  for i in range(0, len(cur), 2):
                      a = cur[i][1]
                      b = cur[i + 1][1] if i + 1 < len(cur) else a
                      nxt.append((cur[i][0] + "|" + (cur[i + 1][0] if i + 1 < len(cur) else cur[i][0]), hashlib.sha256(a + b).digest()))
                  cur = nxt
              return cur[0][1].hex()

          import re
          recomputed = merkle(leaves)
          txt = root_txt.read_text(encoding="utf-8")
          hexes = re.findall(r"[0-9a-f]{64}", txt)
          assert hexes, f"no 64-hex root in ROOT.txt: {txt[:80]!r}"
          claimed = hexes[0]
          print("leaves:", len(leaves))
          print("recomputed root:", recomputed)
          print("claimed root:   ", claimed)
          assert recomputed == claimed, "Merkle root mismatch — archive does not match its own ROOT.txt"
          PY

      - name: Run reference adapter (public split)
        run: |
          cd work
          ds=$(dirname "$(find . -name bench.py | head -1)")
          cd "$ds"
          python bench.py --submit adapter_reference.py | tee /tmp/score.log
          grep -q "public" /tmp/score.log || (echo "no public score line" && exit 1)

      - name: Assert reference score
        run: |
          python - <<'PY'
          import re, sys
          log = open("/tmp/score.log", encoding="utf-8", errors="replace").read()
          line = next((l for l in log.splitlines() if "exact public=" in l), "")
          print(line)
          m = re.search(r"exact public=([0-9.]+)\s+masked=([0-9.]+)", line)
          if not m:
              sys.exit("cannot parse 'exact public=… masked=…' line")
          exact, masked = float(m.group(1)), float(m.group(2))
          expect = 0.9688
          if abs(exact - expect) > 5e-5 or abs(masked - expect) > 5e-5:
              sys.exit(f"reference drifted: exact={exact} masked={masked}, expect {expect}/{expect}")
          # macro_recall 必须与 exact 分开读——exact 单独不是成绩
          assert "macro_recall" in log, "macro_recall line missing"
          print("OK reference exact/masked:", exact, masked)
          PY

      - name: Validate candidate-pool disagreement record
        run: |
          python - <<'PY'
          import json
          d = json.load(open("candidate_pool/disagreement_37.json", encoding="utf-8"))
          m = d["measured"]
          n, a = m["n"], m["agreement"]
          assert n == 37, f"expected 37 cases, got {n}"
          assert abs(m["agreement_rate"] - round(a / n, 4)) < 1e-9, "agreement_rate inconsistent with counts"
          assert abs(m["agreement_rate"] - 0.4865) < 1e-9, "rate drifted from the published 0.486"
          dis = d["disagreements"]
          assert len(dis) == n - a, f"disagreement rows {len(dis)} != {n - a}"
          for x in dis:
              for k in ("case_id", "our_label", "judge", "judge_rules", "cite", "pdf"):
                  assert x.get(k), f"{x.get('case_id')}: missing {k}"
              assert x["pdf"].startswith("https://www.accessdata.fda.gov/"), f"{x['case_id']}: pdf not an FDA link"
              k = x["case_id"].split("-")[0]
              assert x["pdf"].endswith(f"/pdf{k[1:3]}/{k}.pdf"), f"{x['case_id']}: pdf folder/name must be pdf{k[1:3]}/{k}.pdf (this was off by one digit before)"
              assert len(x["cite"]) > 40, f"{x['case_id']}: cite too short to be a verbatim quote"
          print(f"OK: {n} cases, {a} agree, {len(dis)} disagreements, every row carries a quote and an FDA link")
          PY

      - name: Self-test external comparison script
        run: |
          python - <<'PY'
          import json, pathlib
          good = {"team": "ci-good", "adapter_sha256": "a"*64,
                  "public": {"exact": 0.9688, "masked": 0.9688, "tag": 1.0, "macro_recall": 0.875},
                  "controls_pass": True, "rerun_consistent": True}
          bad = {"team": "ci-memoriser", "adapter_sha256": "b"*64,
                 "public": {"exact": 1.0, "masked": 0.125, "tag": 1.0},
                 "controls_pass": True, "rerun_consistent": False}
          pathlib.Path("/tmp/good.json").write_text(json.dumps(good))
          pathlib.Path("/tmp/bad.json").write_text(json.dumps(bad))
          PY
          set +e
          python external_run_kit/compare.py /tmp/good.json > /tmp/cmp_good.log 2>&1; g=$?
          python external_run_kit/compare.py /tmp/bad.json  > /tmp/cmp_bad.log  2>&1; b=$?
          set -e
          cat /tmp/cmp_good.log; echo "---"; cat /tmp/cmp_bad.log
          test "$g" = "0" || { echo "::error title=compare.py rejected the reference-shaped submission::expected exit 0, got $g"; exit 1; }
          test "$b" = "1" || { echo "::error title=compare.py failed to flag the memoriser shape::expected exit 1, got $b"; exit 1; }
          grep -q "masked" /tmp/cmp_bad.log || { echo "::error title=flag text missing"; exit 1; }
          echo "OK: compare.py accepts the reference shape and flags the memoriser/rerun-inconsistent shape"

      - name: Render external-run ledger to job summary
        run: |
          python external_run_kit/render_standings.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload score log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-log
          path: /tmp/score.log
